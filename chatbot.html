<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Chatbot — HelpdeskOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css" />
<style>
/* ── Chat wrapper fills viewport below topbar ── */
#chat-page {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #F0F0F0;
  font-family: 'Outfit', sans-serif;
}

/* ── Chat header strip ── */
#chat-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  background: linear-gradient(135deg, #1e3a8a, #2563eb);
  flex-shrink: 0;
}
#chat-header .bot-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.3);
  flex-shrink: 0;
  background: rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
}
#chat-header .bot-avatar img { width: 100%; height: 100%; object-fit: cover; }
#chat-header .bot-info { flex: 1; }
#chat-header .bot-name  { font-size: 15px; font-weight: 800; color: #fff; }
#chat-header .bot-status { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: rgba(255,255,255,0.65); margin-top: 1px; }
#chat-header .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #22C880; flex-shrink: 0; }

/* ── Messages area ── */
#chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}
#chat-messages::-webkit-scrollbar { width: 4px; }
#chat-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

/* ── Message bubbles ── */
.msg-wrap { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; animation: msgIn .2s ease; }
.msg-wrap.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-wrap.bot  { align-self: flex-start; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.msg-avatar {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  overflow: hidden; border: 1.5px solid rgba(30,60,120,.12);
  background: #eff6ff; display: flex; align-items: center; justify-content: center;
}
.msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

.msg-bubble {
  padding: 11px 15px; border-radius: 18px;
  font-size: 14px; line-height: 1.6;
  max-width: 100%; word-break: break-word;
}
.msg-bubble.bot {
  background: #fff;
  border: 1.5px solid #e8effd;
  color: #0f172a;
  border-radius: 4px 18px 18px 18px;
  box-shadow: 0 1px 6px rgba(37,99,235,.06);
}
.msg-bubble.user {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff;
  border-radius: 18px 18px 4px 18px;
  box-shadow: 0 2px 10px rgba(37,99,235,.25);
}
/* Markdown-style bold */
.msg-bubble strong { font-weight: 700; }

/* Typing indicator */
.msg-bubble.typing { padding: 14px 16px; }
.msg-bubble.typing span {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: #94a3b8; margin: 0 2px;
  animation: typingBounce 1s ease infinite;
}
.msg-bubble.typing span:nth-child(2) { animation-delay: .18s; }
.msg-bubble.typing span:nth-child(3) { animation-delay: .36s; }
@keyframes typingBounce { 0%,80%,100%{transform:scale(.7);opacity:.4} 40%{transform:scale(1);opacity:1} }

/* Problem card inside chat */
.problem-card-inline {
  background: #fff; border: 1.5px solid #e8effd; border-radius: 16px;
  padding: 14px 16px; margin-top: 6px; max-width: 340px;
  box-shadow: 0 2px 12px rgba(37,99,235,.08);
}
.pci-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.pci-icon { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.pci-title { font-weight: 700; font-size: 14px; color: #0f172a; }
.pci-meta  { font-size: 11.5px; color: #94a3b8; margin-top: 1px; }
.pci-steps { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }
.pci-step  { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: #334155; line-height: 1.5; }
.pci-step-num { width: 20px; height: 20px; border-radius: 50%; background: #eff6ff; color: #2563eb; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.pci-btn { width: 100%; padding: 8px; border-radius: 10px; border: none; background: #eff6ff; color: #2563eb; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; transition: background .15s; }
.pci-btn:hover { background: #dbeafe; }

/* Image preview */
#imagePreview {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: #eff6ff;
  border-top: 1px solid #bfdbfe;
}
#imagePreview img { height: 48px; border-radius: 8px; object-fit: cover; }
#removeImageBtn { background: none; border: none; cursor: pointer; color: #94a3b8; font-size: 18px; line-height: 1; }

/* ── Input footer ── */
#chat-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: #fff;
  border-top: 1.5px solid #e8effd;
  flex-shrink: 0;
}
.chat-media-btn {
  width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
  border: 1.5px solid #e2e8f0; background: #f8fafc;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #64748b; transition: all .15s;
}
.chat-media-btn:hover { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; }
.chat-media-btn.recording { background: #fef2f2; border-color: #fecaca; color: #dc2626; }

#chat-input {
  flex: 1; padding: 10px 14px;
  border: 1.5px solid #e2e8f0; border-radius: 12px;
  font-family: 'Outfit', sans-serif; font-size: 14px; color: #0f172a;
  background: #f8fafc; outline: none; transition: all .15s;
  resize: none; min-height: 42px; max-height: 120px; overflow-y: auto;
}
#chat-input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96,165,250,.12); background: #fff; }

#chat-send {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(37,99,235,.3);
  transition: all .18s;
}
#chat-send:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(37,99,235,.4); }
#chat-send:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* Camera modal */
#cameraModal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.88); z-index: 9999;
  flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 20px;
}
#cameraModal video { max-width: 100%; max-height: 60dvh; border-radius: 14px; background: #000; }
.cam-btn { padding: 12px 28px; border-radius: 12px; border: none; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }

/* Mobile adjustments */
@media (max-width: 640px) {
  #chat-header { padding: 10px 14px; }
  #chat-header .bot-name { font-size: 14px; }
  #chat-messages { padding: 12px 10px; }
  .msg-wrap { max-width: 92%; }
  .msg-bubble { font-size: 13.5px; padding: 10px 13px; }
  .problem-card-inline { max-width: 100%; }
  #chat-footer { padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom)); gap: 6px; }
  .chat-media-btn { width: 32px; height: 32px; border-radius: 9px; }
  #chat-input { font-size: 16px; padding: 8px 12px; } /* prevent iOS zoom */
  #chat-send { width: 38px; height: 38px; border-radius: 10px; }
}
</style>
</head>
<body data-page="chatbot" data-root="./">

<div class="main-wrap" style="display:flex;flex-direction:column;height:100vh;overflow:hidden;">
  <header id="topbar" style="flex-shrink:0;"></header>

  <div id="chat-page">

    <!-- Bot header strip -->
    <div id="chat-header">
      <div class="bot-avatar">
        <img src="images/Super AKWA.png" alt="Assistant IA" onerror="this.parentNode.innerHTML='🤖'" />
      </div>
      <div class="bot-info">
        <div class="bot-name">Assistant IA — Akwa IT Support</div>
        <div class="bot-status">
          <span class="status-dot"></span>
          En ligne · Base de connaissance locale active
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div id="chat-messages"></div>

    <!-- Image preview bar -->
    <div id="imagePreview">
      <img id="previewImg" src="" alt="preview" />
      <button id="removeImageBtn" title="Supprimer l'image">✕</button>
      <span id="previewName" style="font-size:12px;color:#64748b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
    </div>

    <!-- Input -->
    <div id="chat-footer">
      <!-- Image upload -->
      <label for="imageInput" class="chat-media-btn" title="Joindre une image">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </label>
      <input type="file" id="imageInput" accept="image/*" style="display:none" />

      <!-- Camera -->
      <button id="openCameraBtn" class="chat-media-btn" title="Prendre une photo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>

      <!-- Voice input -->
      <button id="voiceInputBtn" class="chat-media-btn" title="Dicter un message">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 013 3v8a3 3 0 01-6 0V4a3 3 0 013-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>

      <input id="chat-input" placeholder="Décrivez votre problème… ex: Mon TPE est bloqué"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}" />

      <button id="chat-send" onclick="sendChat()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>

  </div><!-- #chat-page -->

  <!-- Camera modal -->
  <div id="cameraModal">
    <video id="cameraVideo" autoplay playsinline></video>
    <div style="display:flex;gap:14px;">
      <button id="captureBtn" class="cam-btn" style="background:#1e3a8a;color:#fff;">📸 Capturer</button>
      <button id="closeCameraBtn" class="cam-btn" style="background:#444;color:#fff;">✕ Fermer</button>
    </div>
  </div>

</div>

<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
// ── Auth ───────────────────────────────────────
HDOS.requireAccess('chatbot');

// ── State ──────────────────────────────────────
let PROBLEMS = [];
let GROUPS   = [];
let selectedImageBase64 = null;
let selectedImageMime   = null;
let cameraStream        = null;
let isRecording         = false;
let recognition         = null;

// ── Inline fallback data (from ia-app.js _PROBLEMS_INLINE) ─
// Load from data/ files, fall back to inline
async function loadData() {
  try {
    [PROBLEMS, GROUPS] = await Promise.all([
      fetch('./data/problems.json').then(r => r.json()),
      fetch('./data/groups.json').then(r =>  r.json()),
    ]);
  } catch {
    // ia-app.js already defined _PROBLEMS_INLINE and _GROUPS_INLINE globally
    if (typeof _PROBLEMS_INLINE !== 'undefined') {
      PROBLEMS = _PROBLEMS_INLINE;
      GROUPS   = _GROUPS_INLINE;
    }
  }
}

// ── Text rendering (markdown-lite: **bold**) ───
function renderText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

// ── Add message ────────────────────────────────
function addMessage(role, text) {
  const wrap = document.getElementById('chat-messages');
  const row  = document.createElement('div');
  row.className = `msg-wrap ${role}`;

  if (role === 'bot') {
    row.innerHTML = `
      <div class="msg-avatar"><img src="images/Super AKWA.png" alt="bot" onerror="this.parentNode.innerHTML='🤖'"></div>
      <div class="msg-bubble bot">${renderText(text)}</div>`;
  } else {
    row.innerHTML = `<div class="msg-bubble user">${renderText(text)}</div>`;
  }

  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
}

function addImageMessage(role, text, imgSrc) {
  const wrap = document.getElementById('chat-messages');
  const row  = document.createElement('div');
  row.className = `msg-wrap ${role}`;
  let html = '';
  if (role === 'bot') html += `<div class="msg-avatar"><img src="images/Super AKWA.png" alt="bot"></div>`;
  html += `<div class="msg-bubble ${role}">`;
  if (text) html += `<div style="margin-bottom:6px;">${renderText(text)}</div>`;
  html += `<img src="${imgSrc}" style="max-width:220px;border-radius:10px;" alt="image"/>`;
  html += `</div>`;
  row.innerHTML = html;
  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
}

// ── Typing indicator ───────────────────────────
function showTyping() {
  const wrap = document.getElementById('chat-messages');
  const row  = document.createElement('div');
  row.className = 'msg-wrap bot';
  row.id = 'typing-indicator';
  row.innerHTML = `
    <div class="msg-avatar"><img src="images/Super AKWA.png" alt="bot" onerror="this.parentNode.innerHTML='🤖'"></div>
    <div class="msg-bubble bot typing"><span></span><span></span><span></span></div>`;
  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

// ── Show problem card inline ───────────────────
function showProblemCard(problem) {
  const wrap = document.getElementById('chat-messages');
  const row  = document.createElement('div');
  row.className = 'msg-wrap bot';

  const steps = (problem.steps || []).slice(0, 5);
  const stepsHtml = steps.map((s, i) => `
    <div class="pci-step">
      <div class="pci-step-num">${i+1}</div>
      <div>${renderText(s.t)}</div>
    </div>`).join('');

  const hasGuide = !!problem.guideFile;

  row.innerHTML = `
    <div class="msg-avatar"><img src="images/Super AKWA.png" alt="bot" onerror="this.parentNode.innerHTML='🤖'"></div>
    <div>
      <div class="problem-card-inline">
        <div class="pci-header">
          <div class="pci-icon" style="background:${problem.iconBg||'#eff6ff'};color:${problem.iconColor||'#2563eb'};">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">${getIconPath(problem.icon)}</svg>
          </div>
          <div>
            <div class="pci-title">${problem.title}</div>
            <div class="pci-meta">${problem.pl||problem.p||''} · ⏱ ${problem.time||'?'}</div>
          </div>
        </div>
        ${stepsHtml ? `<div class="pci-steps">${stepsHtml}</div>` : ''}
        ${problem.note ? `<div style="font-size:12px;color:#d97706;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;margin-bottom:10px;">⚠️ ${problem.note}</div>` : ''}
        ${hasGuide ? `<button class="pci-btn" onclick="window.open('${problem.guideFile}','_blank')" style="margin-bottom:6px;">📄 Télécharger le guide</button>` : ''}
        ${problem.phone ? `<a href="tel:${problem.phone}" style="display:block;text-align:center;padding:8px;border-radius:10px;background:#ecfdf5;color:#059669;font-weight:700;font-size:13px;text-decoration:none;margin-bottom:6px;">📞 Appeler ${problem.phone}</a>` : ''}
        <button class="pci-btn" onclick="this.closest('.problem-card-inline').nextElementSibling&&this.closest('.problem-card-inline').nextElementSibling.remove();addMessage('user','Problème résolu ✓');setTimeout(()=>addMessage('bot','Super ! Ravi de vous avoir aidé. N\\'hésitez pas si vous avez d\\'autres problèmes.'),400);">
          ✅ Problème résolu
        </button>
      </div>
    </div>`;

  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
}

// ── Icon path lookup (subset of IC object) ────
function getIconPath(key) {
  const paths = {
    creditCard: '<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
    wifi:       '<path d="M1.42 9a16 16 0 0121.16 0"/><path d="M5 12.55a11 11 0 0114.08 0"/><path d="M8.53 16.11a6 6 0 016.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>',
    wifiOff:    '<line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0119 12.55"/><path d="M5 12.55a10.94 10.94 0 015.17-2.39"/><line x1="12" y1="20" x2="12.01" y2="20"/>',
    globe:      '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>',
    lock:       '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',
    unlock:     '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 019.9-1"/>',
    printer:    '<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
    mail:       '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
    shield:     '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    monitor:    '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
    smartphone: '<rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>',
    zap:        '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
    clock:      '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    key:        '<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>',
    server:     '<rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/>',
    building:   '<path d="M6 22V4a2 2 0 012-2h8a2 2 0 012 2v18"/><path d="M6 12H4a2 2 0 00-2 2v8h20v-8a2 2 0 00-2-2h-2"/>',
    folder:     '<path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>',
    fileText:   '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>',
    activity:   '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
    cloud:      '<path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/>',
    wifi2:      '<path d="M5 12.55a11 11 0 0114.08 0"/><path d="M1.42 9a16 16 0 0121.16 0"/><path d="M8.53 16.11a6 6 0 016.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>',
  };
  return paths[key] || paths.monitor;
}

// ── Local reply (keyword matching) ───────────
function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function localReply(text) {
  if (!PROBLEMS.length) return { text: "Données de problèmes non chargées. Veuillez réessayer.", problem: null };
  const q = norm(text);
  const scored = PROBLEMS.map(p => {
    let score = 0;
    (p.keys||[]).forEach(k => { if (q.includes(norm(k))) score += 2; });
    norm(p.title).split(/\s+/).forEach(w => { if (w.length >= 4 && q.includes(w)) score += 1; });
    return { p, score };
  }).filter(x => x.score > 0).sort((a,b) => b.score - a.score);

  if (!scored.length) {
    return {
      text: "Je n'ai pas trouvé de guide pour ce problème exact.\n\nVous pouvez :\n• Appeler le support : **0522 677 766**\n• Créer un ticket via le portail",
      problem: null
    };
  }
  const best   = scored[0].p;
  const others = scored.slice(1,3).map(x => `**${x.p.title}**`).join(', ');
  let msg = `J'ai trouvé un guide pour **${best.title}**.`;
  if (others) msg += `\n\nAutres guides possibles : ${others}`;
  return { text: msg, problem: best };
}

// ── Send chat ─────────────────────────────────
async function sendChat() {
  const input = document.getElementById('chat-input');
  const text  = input.value.trim();
  if (!text && !selectedImageBase64) return;

  input.value = '';
  input.style.height = 'auto';

  if (selectedImageBase64) {
    addImageMessage('user', text || '📷 Image envoyée', `data:${selectedImageMime};base64,${selectedImageBase64}`);
  } else {
    addMessage('user', text);
  }

  document.getElementById('chat-send').disabled = true;
  showTyping();

  // Try Netlify endpoint (only works when deployed), otherwise use local
  // Auto-detect: use Netlify function if deployed there, else local knowledge base
  const isNetlify = window.location.hostname.includes('.netlify.app') ||
                    window.location.hostname.includes('netlify.com') ||
                    (window.location.protocol === 'https:' && !window.location.hostname.includes('localhost'));
  const storedUrl = localStorage.getItem('hdos_ia_api_url');
  const apiUrl = storedUrl || (isNetlify ? '/.netlify/functions/assistant' : '');
  
  if (apiUrl) {
    try {
      const payload = { message: text };
      if (selectedImageBase64) { payload.imageBase64 = selectedImageBase64; payload.imageMimeType = selectedImageMime; }
      const res  = await fetch(apiUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const data = await res.json();
      hideTyping();
      if (data.type === 'flow' && data.flowKey) {
        // Find the problem matching flowKey and show card
        const p = PROBLEMS.find(p => norm(p.title).includes(norm(data.flowKey)) || String(p.id) === String(data.flowKey));
        if (p) { addMessage('bot', `Voici le guide pour résoudre ce problème :`); setTimeout(()=>showProblemCard(p),200); }
        else    { addMessage('bot', data.reply || 'Consultez le guide ci-dessous.'); }
      } else {
        addMessage('bot', data.reply || 'Aucune réponse.');
      }
    } catch {
      hideTyping();
      useFallback(text);
    }
  } else {
    // No API configured — use local knowledge base directly
    await new Promise(r => setTimeout(r, 600)); // natural delay
    hideTyping();
    useFallback(text);
  }

  resetImage();
  document.getElementById('chat-send').disabled = false;
  input.focus();
}

function useFallback(text) {
  const { text: reply, problem } = localReply(text);
  addMessage('bot', reply);
  if (problem) setTimeout(() => showProblemCard(problem), 300);
}

// ── Image handling ─────────────────────────────
function resetImage() {
  selectedImageBase64 = null; selectedImageMime = null;
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('previewImg').src = '';
  document.getElementById('imageInput').value = '';
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('imageInput').addEventListener('change', function() {
    const file = this.files && this.files[0];
    if (!file) { resetImage(); return; }
    selectedImageMime = file.type || 'image/png';
    const reader = new FileReader();
    reader.onload = e => {
      const result = e.target.result;
      selectedImageBase64 = result.includes(',') ? result.split(',')[1] : result;
      document.getElementById('previewImg').src     = result;
      document.getElementById('previewName').textContent = file.name;
      document.getElementById('imagePreview').style.display = 'flex';
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('removeImageBtn').addEventListener('click', resetImage);

  // ── Camera ──────────────────────────────────
  const openCamBtn    = document.getElementById('openCameraBtn');
  const cameraModal   = document.getElementById('cameraModal');
  const cameraVideo   = document.getElementById('cameraVideo');
  const captureBtn    = document.getElementById('captureBtn');
  const closeCamBtn   = document.getElementById('closeCameraBtn');

  openCamBtn.addEventListener('click', async () => {
    if (!navigator.mediaDevices?.getUserMedia) { alert("Caméra non disponible."); return; }
    cameraModal.style.display = 'flex';
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' } });
      cameraVideo.srcObject = cameraStream;
    } catch { alert("Impossible d'accéder à la caméra."); cameraModal.style.display='none'; }
  });

  captureBtn.addEventListener('click', () => {
    if (!cameraVideo.videoWidth) return;
    const canvas = document.createElement('canvas');
    canvas.width  = cameraVideo.videoWidth;
    canvas.height = cameraVideo.videoHeight;
    canvas.getContext('2d').drawImage(cameraVideo, 0, 0);
    const dataUrl = canvas.toDataURL('image/png');
    selectedImageBase64 = dataUrl.split(',')[1];
    selectedImageMime   = 'image/png';
    document.getElementById('previewImg').src = dataUrl;
    document.getElementById('previewName').textContent = 'photo.png';
    document.getElementById('imagePreview').style.display = 'flex';
    cameraModal.style.display = 'none';
    stopCamera();
  });

  closeCamBtn.addEventListener('click', () => { cameraModal.style.display='none'; stopCamera(); });

  // ── Voice input ─────────────────────────────
  const voiceBtn = document.getElementById('voiceInputBtn');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { voiceBtn.style.display = 'none'; }
  else {
    recognition = new SR();
    recognition.lang = 'fr-FR';
    recognition.interimResults = true;
    recognition.onstart  = () => { isRecording=true;  voiceBtn.classList.add('recording'); };
    recognition.onend    = () => { isRecording=false; voiceBtn.classList.remove('recording'); };
    recognition.onresult = e => {
      const t = Array.from(e.results).map(r=>r[0].transcript).join(' ');
      document.getElementById('chat-input').value = t;
      if (e.results[e.results.length-1].isFinal && t.trim()) sendChat();
    };
    recognition.onerror = () => { isRecording=false; voiceBtn.classList.remove('recording'); };
    voiceBtn.addEventListener('click', () => {
      try { isRecording ? recognition.stop() : recognition.start(); } catch {}
    });
  }

  // Auto-resize textarea
  document.getElementById('chat-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });
});

function stopCamera() {
  if (cameraStream) { cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
  document.getElementById('cameraVideo').srcObject = null;
}

// ── Init ──────────────────────────────────────
loadData().then(() => {

});
