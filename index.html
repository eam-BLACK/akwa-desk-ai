<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion — HelpdeskOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 50%,#0f172a 100%); padding:24px; position:relative; overflow:hidden; }
  body::before { content:''; position:fixed; inset:0; background-image:radial-gradient(circle,rgba(255,255,255,0.04) 1px,transparent 1px); background-size:28px 28px; pointer-events:none; }
  .blob1 { position:fixed; width:500px; height:500px; background:radial-gradient(circle,rgba(37,99,235,0.18),transparent 70%); border-radius:50%; top:-100px; right:-100px; pointer-events:none; }
  .blob2 { position:fixed; width:400px; height:400px; background:radial-gradient(circle,rgba(99,102,241,0.12),transparent 70%); border-radius:50%; bottom:-100px; left:-100px; pointer-events:none; }
  .card { background:rgba(255,255,255,0.97); border-radius:24px; padding:36px; width:100%; max-width:440px; box-shadow:0 24px 60px -12px rgba(0,0,0,0.5); position:relative; z-index:1; animation:slideUp .5s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes slideUp { from{opacity:0;transform:translateY(24px) scale(.97)} to{opacity:1;transform:none} }
  .logo { width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg,#1d4ed8,#3b82f6); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; box-shadow:0 8px 24px -4px rgba(37,99,235,.5); }
  .label { display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:6px; }
  .input { width:100%; font-size:16px; padding:10px 14px; border:1.5px solid #e2e8f0; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:14px; color:#0f172a; transition:border-color .15s, box-shadow .15s; outline:none; }
  .input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.12); }
  .input.shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  .btn-main { width:100%; padding:12px; background:linear-gradient(135deg,#1d4ed8,#2563eb); color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:14.5px; border:none; border-radius:12px; cursor:pointer; transition:all .18s; box-shadow:0 6px 20px -4px rgba(37,99,235,.5); display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-main:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 10px 28px -4px rgba(37,99,235,.55); }
  .btn-main:disabled { opacity:.7; cursor:not-allowed; transform:none; }
  .error-box { display:none; padding:10px 14px; background:#fef2f2; border:1.5px solid #fecaca; border-radius:11px; color:#dc2626; font-size:13px; margin-bottom:14px; gap:8px; align-items:center; }
  .error-box.show { display:flex; }
  .info-box { display:none; padding:10px 14px; background:#ecfdf5; border:1.5px solid #a7f3d0; border-radius:11px; color:#059669; font-size:13px; margin-bottom:14px; gap:8px; align-items:center; }
  .info-box.show { display:flex; }
  .pwd-wrap { position:relative; }
  .pwd-eye { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#94a3b8; display:flex; align-items:center; transition:color .12s; }
  .pwd-eye:hover { color:#475569; }
  .divider { border:none; border-top:1px solid #f1f5f9; margin:18px 0; }
</style>
</head>
<body data-root="./" data-page="login">
  <div class="blob1"></div><div class="blob2"></div>

  <div style="position:absolute;top:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;z-index:2;">
    <div style="width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#60a5fa);display:flex;align-items:center;justify-content:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:14px;color:rgba(255,255,255,.9);">HelpdeskOS</span>
  </div>

  <div class="card">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:21px;color:#0f172a;text-align:center;margin-bottom:4px;">Bienvenue</h1>
    <p style="font-size:13.5px;color:#64748b;text-align:center;margin-bottom:22px;">Connectez-vous à votre portail IT</p>

    <div class="error-box" id="errBox"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span id="errTxt"></span></div>
    <div class="info-box"  id="infoBox"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg><span id="infoTxt"></span></div>

    <form onsubmit="doLogin(event)" novalidate>
      <div style="margin-bottom:14px;">
        <label class="label" for="loginInput">Email ou identifiant</label>
        <input id="loginInput" type="text" class="input" placeholder="vous@company.com ou admin" autocomplete="username" spellcheck="false" />
      </div>
      <div style="margin-bottom:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <label class="label" style="margin:0;">Mot de passe</label>
          <a href="#" onclick="forgotPwd(event)" style="font-size:12.5px;color:#2563eb;font-weight:600;text-decoration:none;">Mot de passe oublié ?</a>
        </div>
        <div class="pwd-wrap">
          <input id="pwdInput" type="password" class="input" placeholder="••••••••" autocomplete="current-password" style="padding-right:40px;" />
          <button type="button" class="pwd-eye" onclick="togglePwd()">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-main" id="submitBtn">
        <span id="btnTxt">Se connecter</span>
        <svg id="btnArrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>
    <p style="text-align:center;font-size:12px;color:#94a3b8;margin-top:18px;">Besoin d'aide ? <a href="tel:+15550001234" style="color:#2563eb;font-weight:600;text-decoration:none;">+1 (555) 000-1234</a></p>
  </div>

<script src="js/app.js"></script>
<script>
  // Always re-seed to pick up latest user definitions
  (function() {
    const stored = HDOS.getData('users', null);
    const needsReset = !stored || !stored.length || !stored[0].password ||
      // Reset if users differ from seed (e.g., old multi-user data)
      (stored.length > 5);
    if (needsReset) {
      ['hdos_initialized','hdos_users','hdos_tickets'].forEach(k => localStorage.removeItem(k));
    }
    HDOS.initData();
  })();

  if (HDOS.getSession()) location.href = 'dashboard.html';

  function togglePwd() {
    const i=document.getElementById('pwdInput'), icon=document.getElementById('eyeIcon');
    if(i.type==='password'){i.type='text';icon.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/>';}
    else{i.type='password';icon.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';}
  }

  function clearMsgs() { document.getElementById('errBox').classList.remove('show'); document.getElementById('infoBox').classList.remove('show'); }
  function showErr(msg) { clearMsgs(); document.getElementById('errTxt').textContent=msg; document.getElementById('errBox').classList.add('show'); ['loginInput','pwdInput'].forEach(id=>{const el=document.getElementById(id);el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}); }
  function showInfo(msg) { clearMsgs(); document.getElementById('infoTxt').textContent=msg; document.getElementById('infoBox').classList.add('show'); setTimeout(()=>document.getElementById('infoBox').classList.remove('show'),4000); }

  function forgotPwd(e) {
    e.preventDefault();
    const login = document.getElementById('loginInput').value.trim();
    if (login) showInfo(`Un lien de réinitialisation a été envoyé à ${login}.`);
    else showErr('Saisissez d\'abord votre email, puis cliquez sur "Mot de passe oublié".');
  }

  function doLogin(e) {
    e.preventDefault();
    clearMsgs();
    const login = document.getElementById('loginInput').value.trim();
    const pwd   = document.getElementById('pwdInput').value;
    const btn   = document.getElementById('submitBtn');
    const btnTxt= document.getElementById('btnTxt');
    const arrow = document.getElementById('btnArrow');
    if (!login) { showErr('Veuillez saisir votre identifiant.'); return; }
    if (!pwd)   { showErr('Veuillez saisir votre mot de passe.'); return; }
    btn.disabled=true; btnTxt.textContent='Connexion…'; arrow.style.display='none';
    // Show syncing state
    btnTxt.textContent = 'Synchronisation…';

    HDOS.login(login, pwd).then(res => {
      if (res.ok) {
        btnTxt.textContent='✓ Connecté !';
        btn.style.background='linear-gradient(135deg,#059669,#10b981)';
        btn.style.boxShadow='0 6px 20px -4px rgba(5,150,105,.5)';
        setTimeout(() => location.href='dashboard.html', 450);
      } else {
        showErr(res.error);
        btn.disabled=false; btnTxt.textContent='Se connecter'; arrow.style.display=''; btn.style.background=''; btn.style.boxShadow='';
      }
    }).catch(() => {
      showErr('Erreur de connexion. Réessayez.');
      btn.disabled=false; btnTxt.textContent='Se connecter'; arrow.style.display=''; btn.style.background=''; btn.style.boxShadow='';
    });
  }

  document.getElementById('loginInput').addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();document.getElementById('pwdInput').focus();} });
</script>
</body>
</html>
