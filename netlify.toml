[build]
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── Ensure npm install runs for @netlify/blobs ────────────
[build.processing]
  skip_processing = false

# ── CORS for all functions ────────────────────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "POST, OPTIONS"

# ── No-cache for app files (always fresh) ────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# ── Long-cache for images and guides ─────────────────────
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/guide/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── All routes serve the app (no 404 on direct URL) ──────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
  force  = false
